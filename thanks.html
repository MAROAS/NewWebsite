<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You – DODO Transport</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      background: #dba505;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #1a73e8;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 24px;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .home-btn:hover {
      background: #0f5ac6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Thank You!</h1>
    <p>Your message has been successfully sent to DODO Transport.</p>
    <p>Our team will get back to you shortly.</p>

    <a href="https://www.dodotransport.com.au" class="home-btn">Return to Home</a>
  </div>
</body>
</html>
