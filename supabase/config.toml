# Minimal Supabase CLI config for deploying the DODO website Edge Functions.
# Only the settings below are used by `supabase functions deploy`; everything else keeps CLI defaults.
project_id = "dodo-website"

# Public website endpoints and the Resend webhook: the platform JWT check is off because each function
# does its own checks (allowed origins, validation, rate limits, duplicate checks; Svix signature for the webhook).
[functions.website-booking-request]
verify_jwt = false

[functions.website-contact-message]
verify_jwt = false

[functions.website-driver-application]
verify_jwt = false

[functions.resend-email-events]
verify_jwt = false
